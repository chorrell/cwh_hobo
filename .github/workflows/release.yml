name: Release
permissions:
  contents: read
  pull-requests: write

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
      - name: Build Plugin
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          php cwh_hobo.php > cwh_hobo.txt
          zip --junk-paths "cwh_hobo-${VERSION}.zip" cwh_hobo.txt README.md
      - name: Create Release
        # zizmor: ignore[superfluous-actions] keeping the well-known release action rather than raw `gh` CLI calls
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            cwh_hobo.txt
            cwh_hobo-${{ steps.get_version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
